<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cockpit — HubSpot + Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#EFE9DC; --panel:#FDFBF0; --panel2:#FBF6EC; --sunk:#F3EDE0;
    --ink:#1A1613; --muted:#6E6558; --muted2:#736857; --line:#E4DBC6;
    --line-soft:#F0E9D8; --line-btn:#D8CFBA; --ter:#A2937A;
    --red:#E51A31; --red-dk:#C7142A; --red-soft:#FBEEF0;
    --green:#1E7A63; --green-soft:#E9F4EF; --amber:#B0782A; --amber-soft:#FBF1DF;
    --dark:#1A1613; --dark-ink:#FFFDF8; --dark-mut:#9C9284; --dark-fill:rgba(253,251,240,.07);
    --shadow:0 1px 3px rgba(26,22,19,.05);

    --shadow-sm:var(--shadow); --shadow-md:var(--shadow); --shadow-lg:0 24px 56px -28px rgba(26,22,19,.55);
    --violet:#7A6EF0; --blue:#2563EB; --pink:#D63C7D;

    /* Escala de raio — igual aos designs/*.html: card 18px, sub-card ~12px, linha ~9px */
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:18px; --r-pill:999px;
    /* Curva de movimento única, pra todo hover/transição ter a mesma sensação */
    --ease:cubic-bezier(.2,.7,.3,1);

    /* Tokens novos (redesenho estrutural): grid de 8px, tamanhos de ícone, foco e nav.
       Aditivos — nada existente foi renomeado, então nenhum uso antigo quebra. */
    --sp-1:4px; --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:32px; --sp-6:48px;
    --icon-sm:16px; --icon-md:20px; --icon-lg:24px;
    --focus-ring:0 0 0 3px rgba(37,99,235,.45);
    --nav-width:220px; --nav-width-compact:72px;
  }
  :focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:var(--r-sm); }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-variant-numeric:tabular-nums;}
  h1,h2,h3,.disp{font-family:'Poppins',sans-serif;letter-spacing:-.01em;}
  .num, .kpi .v, .week-kpi .v, .daily-consolidado-kpi .v{font-variant-numeric:tabular-nums;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--line);padding-bottom:18px;margin-bottom:8px;}
  .topbar .eyebrow{color:var(--muted2);font-size:12px;letter-spacing:.06em;font-weight:600;margin-bottom:4px;}
  .topbar h1{font-size:34px;font-weight:800;margin:0;line-height:1;color:var(--ink);}
  .updated{color:var(--muted2);font-size:11.5px;margin-bottom:24px;}
  .hint{color:var(--muted);font-size:12.5px;margin-bottom:24px;font-style:italic;}
  .source-tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:var(--r-pill);letter-spacing:.03em;margin-right:6px;}
  .source-tag.hub{background:rgba(59,111,176,.12);color:var(--blue);}
  .source-tag.exp{background:var(--green-soft);color:var(--green);}

  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
  .kpi-strip.exp{grid-template-columns:repeat(7,1fr);}
  .kpi{background:var(--panel);padding:16px 18px;border-radius:var(--r-md);box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .kpi .v{font-size:26px;font-weight:700;color:var(--ink);}
  .kpi .l{color:var(--muted);font-size:10.5px;margin-top:5px;letter-spacing:.03em;font-weight:600;}
  /* ---- KPI strip principal (redesign 27/07/2026) — faixa escura no topo do Cockpit ---- */
  /* Correção v3 1.2: activateTab foca o título da view com tabindex=-1 (acessibilidade) —
     o browser pintava um anel azul default em TODOS os títulos escuros, parecendo campo
     editável. tabindex=-1 nunca é alcançável por teclado, então suprimir o outline aqui
     não prejudica navegação por teclado (o :focus-visible dos elementos interativos fica). */
  [tabindex="-1"]:focus{outline:none;}
  /* Correção v3 Bloco 3 — anti-sobreposição global. Títulos/bolds que quebram linha
     precisam de line-height >= 1.25 pra 2ª linha não pintar por cima nem ser clipada;
     números grandes de linha única (tabular-nums, nunca quebram) mantêm seus line-heights
     apertados via regras/inline mais específicos, que vencem estas. */
  h1,h2,h3,h4{line-height:1.25;}
  .chart-card h3{line-height:1.35;}
  b,strong{line-height:1.35;}
  .mini-hero-title{line-height:1.3;}
  .ag-qstrip-h b,.ag-qstrip-h span{line-height:1.4;}
  .cockpit-hero-combo{position:relative;background:var(--dark);border-radius:var(--r-xl);padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:30px;flex-wrap:wrap;}
  .cockpit-hero-combo .kpi-strip-hero{background:none;box-shadow:none;padding:0;margin-bottom:0;border-radius:0;flex:1;min-width:0;}
  .meu-funil-grid{}
  @media (max-width:900px){ .meu-funil-grid{grid-template-columns:1fr !important;} }
  @media (max-width:760px){ .cockpit-hero-combo{flex-direction:column;align-items:stretch;} }

  /* Prospecção: uma fila única, legível no desktop e acionável no celular. */
  .prospeccao-table-grid{
    display:grid;
    grid-template-columns:36px minmax(260px,1.9fr) minmax(120px,.9fr) minmax(112px,.75fr) minmax(110px,.8fr) minmax(96px,.7fr);
    column-gap:12px;
    align-items:center;
  }
  .prospeccao-table-grid.is-rep{
    grid-template-columns:minmax(280px,1.9fr) minmax(130px,.9fr) minmax(112px,.75fr) minmax(120px,.8fr) 112px;
  }
  .prospeccao-linha{transition:background .14s var(--ease);}
  .prospeccao-linha:hover{background:var(--panel2);}
  .prospeccao-impacto{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
  .prospeccao-impacto b{font-family:'Poppins',sans-serif;font-size:13px;}
  .prospeccao-impacto small{font-size:9.5px;color:var(--muted2);font-weight:600;}
  .prospeccao-mobile-meta{display:none;}
  .prospeccao-exec-hero{position:relative;overflow:hidden;background:var(--dark);border-radius:var(--r-xl);padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);color:var(--dark-ink);}
  .prospeccao-exec-hero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-110px;top:-150px;background:radial-gradient(circle,rgba(37,99,235,.24),transparent 68%);pointer-events:none;}
  .prospeccao-exec-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;position:relative;z-index:1;}
  .prospeccao-exec-kicker{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#8FB5FF;margin-bottom:7px;}
  .prospeccao-exec-title{font-family:'Poppins',sans-serif;font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0;color:#fff;}
  .prospeccao-exec-sub{font-size:12px;line-height:1.55;color:var(--dark-mut);margin-top:7px;max-width:650px;}
  .prospeccao-exec-side{min-width:315px;display:grid;gap:10px;}
  .prospeccao-exec-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .prospeccao-exec-stat{padding:10px 12px;border:1px solid var(--dark-fill);border-radius:12px;background:rgba(255,255,255,.035);}
  .prospeccao-exec-stat b{display:block;font-family:'Poppins',sans-serif;font-size:19px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
  .prospeccao-exec-stat span{display:block;font-size:9.5px;line-height:1.25;color:var(--dark-mut);margin-top:5px;}
  .prospeccao-exec-progress-copy{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--dark-mut);}
  .prospeccao-exec-progress-copy b{color:#fff;}
  .prospeccao-exec-progress{height:7px;border-radius:999px;background:var(--dark-fill);overflow:hidden;margin-top:6px;}
  .prospeccao-exec-progress>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2563EB,#70A1FF);}
  .prospeccao-exec-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;position:relative;z-index:1;}
  .prospeccao-exec-place{font-size:11px;color:var(--dark-mut);padding:8px 11px;border:1px solid var(--dark-fill);border-radius:999px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prospeccao-exec-cta{margin-left:auto;border:0;border-radius:999px;padding:10px 17px;background:#2563EB;color:#fff;font:800 12px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 8px 22px rgba(37,99,235,.28);}
  .prospeccao-exec-cta:hover{background:#1D4ED8;transform:translateY(-1px);}
  .prospeccao-rota-quick{border:1px solid #2563EB;border-radius:999px;padding:7px 12px;background:#2563EB;color:#fff;font:800 11px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}
  .prospeccao-rota-quick:hover{background:#1D4ED8;border-color:#1D4ED8;}
  .prospeccao-rota-quick.is-added{background:#EAF1FF;color:#1D4ED8;border-color:#B9CEFF;}
  .prospeccao-rota-quick:disabled{opacity:.55;cursor:wait;}
  @media (max-width:900px){
    .prospeccao-exec-main{grid-template-columns:1fr;gap:18px;}
    .prospeccao-exec-side{min-width:0;}
  }
  @media (max-width:760px){
    .prospeccao-table-head{display:none !important;}
    .prospeccao-table-grid.prospeccao-linha{
      grid-template-columns:22px minmax(0,1fr) auto !important;
      column-gap:10px;
      row-gap:5px;
      padding:13px 14px !important;
      align-items:start;
    }
    .prospeccao-table-grid.prospeccao-linha.is-rep{grid-template-columns:minmax(0,1fr) auto !important;}
    .prospeccao-linha.is-rep .prospeccao-col-name{grid-column:1;}
    .prospeccao-linha.is-rep .prospeccao-col-reviews{grid-column:2;}
    .prospeccao-linha.is-rep .prospeccao-col-place{grid-column:1;}
    .prospeccao-linha.is-rep .prospeccao-col-owner{grid-column:1;}
    .prospeccao-linha.is-rep .prospeccao-col-source{grid-column:2;}
    .prospeccao-col-check{grid-column:1;grid-row:1 / span 3;}
    .prospeccao-col-name{grid-column:2;grid-row:1;min-width:0;}
    .prospeccao-col-name b{display:block;white-space:normal;overflow-wrap:anywhere;}
    .prospeccao-col-reviews{grid-column:3;grid-row:1;}
    .prospeccao-col-place{grid-column:2;grid-row:2;color:var(--muted);font-size:11.5px;}
    .prospeccao-col-owner{grid-column:2;grid-row:3;color:var(--muted2);font-size:10.5px;}
    .prospeccao-col-source{grid-column:3;grid-row:3;text-align:right !important;font-size:9.5px !important;max-width:100px;overflow:hidden;text-overflow:ellipsis;}
    .prospeccao-mobile-meta{display:inline;}
    .prospeccao-toolbar{padding:16px 14px 0 !important;}
    .prospeccao-footer{padding:12px 14px !important;}
    .prospeccao-exec-hero{padding:20px 18px;border-radius:20px;}
    .prospeccao-exec-title{font-size:23px;}
    .prospeccao-exec-stats{gap:6px;}
    .prospeccao-exec-stat{padding:9px;}
    .prospeccao-exec-stat b{font-size:17px;}
    .prospeccao-exec-actions{align-items:stretch;}
    .prospeccao-exec-place{width:100%;max-width:none;}
    .prospeccao-exec-cta{margin-left:0;width:100%;min-height:42px;}
  }

  .kpi-strip-hero{position:relative;background:var(--dark);border-radius:var(--r-xl);padding:26px 26px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:20px;margin-bottom:20px;box-shadow:var(--shadow);}
  .kpi-hero{transition:transform .18s var(--ease);position:relative;}
  .kpi-hero:not(:last-child)::after{content:"";position:absolute;top:2px;bottom:2px;right:-10px;width:1px;background:var(--dark-fill);}
  .kpi-hero:hover{transform:translateY(-2px);}
  .kpi-hero .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dark-mut);margin-bottom:6px;}
  .kpi-hero .v{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--dark-ink);font-variant-numeric:tabular-nums;}
  .kpi-hero .stat-hint{font-size:11.5px;color:var(--dark-mut);margin-top:5px;line-height:1.4;}
  .kpi-hero .kpi-delta{font-family:'DM Sans',sans-serif;}
  .kpi-label{margin:0 0 10px;color:var(--muted);font-size:11.5px;letter-spacing:.04em;font-weight:600;}

  .section-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 14px;}
  .section-title h2{font-size:19px;margin:0;font-weight:700;}
  .section-title .sub{color:var(--muted);font-size:12px;}

  .banner{background:var(--amber-soft);border:1px solid rgba(184,121,14,.25);border-radius:var(--r-md);padding:14px 18px;font-size:13px;color:var(--amber);margin-bottom:8px;line-height:1.65;}
  .banner b{color:var(--ink);}

  .charts-row{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;margin-bottom:8px;}
  .charts-row-3col{grid-template-columns:1.2fr 1fr 1fr;}
  @media (max-width:1180px){ .charts-row-3col{grid-template-columns:1fr 1fr;} .charts-row-3col #decisoesBloco{grid-column:1 / -1;} }
  /* Usado só no bloco Leads Quentes / Funil por etapa — inverte a proporção pra dar mais
     largura ao primeiro card (Leads Quentes), sem mudar o comportamento padrão de
     .charts-row usado em todos os outros lugares (Resumo Semanal, dossiê, modal). */
  .charts-row.quentes-primeiro{grid-template-columns:1.3fr 1fr;}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow-sm);transition:box-shadow .18s var(--ease),transform .18s var(--ease);}
  .chart-card:hover{box-shadow:var(--shadow-md);}
  .rep-row{transition:background .15s var(--ease);}
  /* "Onde agir hoje" — linha de decisão com quadrado de ranking (1º/2º/3º), reaproveita
     as mesmas cores de severidade usadas no resto do app (--red/--amber/--sunk). */
  .decisao-rank-item{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;background:var(--panel2);margin-bottom:8px;min-height:44px;transition:background .15s var(--ease);cursor:pointer;}
  .decisao-rank-item:last-child{margin-bottom:0;}
  .decisao-rank-item:hover{background:var(--sunk);}
  .decisao-rank-square{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;}
  .decisao-rank-square.r1{background:var(--red);color:#fff;}
  .decisao-rank-square.r2{background:var(--amber-soft);color:var(--amber);}
  .decisao-rank-square.r3{background:var(--sunk);color:var(--muted);}
  .decisao-rank-item .txt{flex:1;min-width:0;}
  .decisao-rank-item .txt .principal{font-size:13.5px;font-weight:600;color:var(--ink);}
  .decisao-rank-item .txt .impacto{font-size:11.5px;color:var(--muted2);margin-top:2px;}
  .decisao-rank-item .abrir{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--red);white-space:nowrap;}
  .decisoes-mais{background:none;border:none;color:var(--muted2);font-size:11.5px;cursor:pointer;padding:6px 0 0;text-align:left;font-family:inherit;}
  .decisoes-mais:hover{color:var(--ink);text-decoration:underline;}

  /* Pódio + Meta do mês consolidados num cartão só — linhas horizontais em vez de cartões
     lado a lado, e a barra de meta vive no rodapé do mesmo cartão. */
  .podio-linha{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;background:var(--panel2);margin-bottom:8px;min-height:44px;}
  .podio-linha:last-child{margin-bottom:0;}
  .podio-linha.p1{background:var(--amber-soft);}
  .podio-linha.p1 .podio-linha-metric{color:var(--amber);}
  .podio-linha-medal{font-size:15px;flex-shrink:0;}
  .podio-linha-info{flex:1;min-width:0;}
  .podio-linha-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .podio-linha-praca{font-size:11px;color:var(--muted2);}
  .podio-linha-metric{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .meta-mes-rodape{border-top:1px solid var(--line);margin-top:13px;padding-top:13px;}
  .meta-mes-rodape .linha1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .meta-mes-rodape .rotulo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);}
  .meta-mes-rodape .valor{font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums;}
  .meta-mes-rodape .valor b{color:var(--ink);}
  .meta-mes-track{height:7px;background:var(--sunk);border-radius:999px;overflow:hidden;}
  .meta-mes-fill{height:100%;border-radius:999px;background:var(--red);transition:width .4s var(--ease);}
  .lead-prio-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);background:var(--panel2);margin-bottom:8px;}
  .lead-prio-row:last-child{margin-bottom:0;}
  .lead-prio-row .nome{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lead-prio-row .meta{font-size:11.5px;color:var(--muted2);}
  .lead-prio-row .chance{flex:none;font-size:11px;font-weight:800;border-radius:var(--r-pill);padding:4px 10px;}
  .lead-prio-row .abrir{flex:none;font-size:11px;font-weight:700;color:var(--red);cursor:pointer;}
  .chart-card h3{font-size:14px;margin:0 0 16px;font-weight:700;text-transform:none;letter-spacing:0;font-family:'DM Sans',sans-serif;color:var(--ink);}

  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .donut::after{content:"";position:absolute;inset:22px;background:var(--panel);border-radius:50%;}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12px;}
  .legend-item{display:flex;align-items:center;gap:7px;}
  .legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .legend-val{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;padding-left:10px;}

  .bar-chart{display:flex;flex-direction:column;gap:11px;}
  .bar-row{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;}
  .bar-label{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
  .bar-track{background:var(--panel2);height:14px;border-radius:var(--r-sm);position:relative;overflow:hidden;}
  .bar-fill{height:100%;transition:width .3s var(--ease);border-radius:var(--r-sm);}
  .bar-val{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);text-align:right;}
  /* ---- Funil por etapa (barras horizontais com % de conversão, redesign 27/07/2026) ---- */
  .funil-bar-row{display:grid;grid-template-columns:150px 1fr auto 58px;align-items:center;gap:10px;margin-bottom:10px;}
  .funil-bar-row:last-child{margin-bottom:0;}
  .funil-bar-row.clickable{cursor:pointer;border-radius:var(--r-sm);transition:background .12s var(--ease);}
  .funil-bar-row.clickable:hover{background:var(--panel2);}
  .funil-preso-row.clickable{border-radius:var(--r-sm);transition:background .12s var(--ease);padding:4px 6px;margin:-4px -6px 6px;}
  .funil-preso-row.clickable:hover{background:var(--panel2);}
  .funil-bar-label{font-size:12.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .funil-bar-track{background:var(--panel2);height:22px;border-radius:var(--r-sm);position:relative;overflow:hidden;}
  .funil-bar-fill{height:100%;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:flex-end;padding-right:9px;transition:width .3s var(--ease);min-width:30px;}
  .funil-bar-fill .val{color:#fff;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .funil-bar-conv{font-family:'DM Sans',sans-serif;font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;}

  .reps{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}

// ============ COACHING (análise individual — só o gestor vê) ============
function tendenciaBadge(texto) {
  if (!texto) return '';
  const t = texto.toLowerCase();
  let cor = 'var(--muted2)', bg = 'var(--panel2)', icone = '➖', palavra = 'Estável';
  if (t.includes('melhor')) { cor = 'var(--green)'; bg = 'var(--green-soft)'; icone = '📈'; palavra = 'Melhorando'; }
  else if (t.includes('pior')) { cor = 'var(--red)'; bg = 'var(--red-soft)'; icone = '📉'; palavra = 'Piorando'; }
  else if (t.includes('estável') || t.includes('estavel')) { cor = 'var(--amber)'; bg = 'var(--amber-soft)'; icone = '➡️'; palavra = 'Estável'; }
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:${cor};background:${bg};padding:3px 10px;border-radius:var(--r-lg);white-space:nowrap;flex-shrink:0;">${icone} ${palavra}</span>`;
}


async function renderCoaching() {

           datado, e o mês passado fica arquivado/colapsado — não é o que importa hoje. -->

      <details class="coachingMensalWrap" style="margin-bottom:16px;display:none;">
        <summary class="card-summary" style="font-size:11.5px;color:var(--muted2);cursor:pointer;">📅 Ver fechamento do mês passado (arquivado)</summary>
        <div class="coachingMensal" style="margin-top:8px;"></div>
      </details>

      <div class="daily-col-label" style="margin-bottom:8px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:5px;"><path d="M3 14v-2a9 9 0 0118 0v2"/><rect x="1" y="14" width="6" height="7" rx="2"/><rect x="17" y="14" width="6" height="7" rx="2"/></svg>Roteiro do 1:1</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px;">
        <div style="background:var(--panel2);border-radius:var(--r-lg);padding:13px 15px;">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted2);margin-bottom:4px;">1 · ABRIR PELO QUE FOI BEM</div>

        <div style="background:var(--panel2);border-radius:var(--r-lg);padding:13px 15px;">
          <div style="font-size:10.5px;font-weight:700;color:var(--muted2);margin-bottom:4px;">3 · CHECAR A ADERÊNCIA</div>
          <div style="font-size:12.5px;">Visitas informadas na Daily: <b>${visitasInformadasTexto(r.ownerId)}</b>. Bateu o prometido?</div>
        </div>
        <div style="background:var(--red-soft);border-radius:var(--r-lg);padding:13px 15px;">
          <div style="font-size:10.5px;font-weight:700;color:var(--red);margin-bottom:4px;">4 · FECHAR COMPROMISSO</div>
          <div style="font-size:12.5px;">"O que você se compromete a fazer diferente até nosso próximo 1:1?"</div>

      <details style="margin-bottom:14px;">
        <summary class="card-summary" style="font-size:11.5px;color:var(--muted);">Ver histórico semanal completo</summary>
        <div class="coachingHistoricoCompleto" style="margin-top:8px;"></div>
      </details>

      <div style="border-top:1px dashed var(--line);padding-top:12px;">
        <div class="daily-col-label" style="margin-bottom:6px;">Fechar o 1:1 com um compromisso visível</div>
        <textarea class="sugestaoPlanoInput" placeholder="Ex.: até quarta, avançar os 5 negócios mais antigos de Visita e registrar o próximo passo datado." style="width:100%;min-height:50px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-family:inherit;font-size:12px;margin-bottom:6px;"></textarea>
        <button class="sugestaoPlanoBtn" style="background:var(--red);color:#fff;border:none;border-radius:var(--r-pill);padding:6px 14px;font-size:11.5px;font-weight:700;cursor:pointer;">Enviar compromisso</button>

  const stageEntriesBrutos = Object.entries(r.stages || {});
  const stageEntries = ORDEM_ETAPAS_FUNIL.filter(sid => (r.stages || {})[sid] > 0).map(sid => [sid, r.stages[sid]]);

        <span style="height:14px;background:var(--sunk);border-radius:5px;overflow:hidden;"><span style="display:block;height:14px;width:${Math.max(8, c / maxV * 100).toFixed(0)}%;background:${stageColor(sid)};border-radius:5px;color:#fff;font-size:9.5px;font-weight:700;text-align:right;padding-right:5px;line-height:14px;box-sizing:border-box;">${c}</span></span>

    });

  const ownerId = r.ownerId;
  const { data: semanas, error: erroSemanas } = await supa
    .from('analise_individual_semanal')
    .select('*')
    .eq('owner_id', ownerId)
    .order('created_at', { ascending: false })
    .limit(6);

  const { data: mensais, error: erroMensal } = await supa
    .from('analise_individual_mensal')
    .select('*')
    .eq('owner_id', ownerId)

  const { data: sugestoes } = await supa

  const sugestoesEl = el.querySelector('.sugestoesAnteriores');

  }

  el.querySelector('.sugestaoPlanoBtn').addEventListener('click', async () => {
    const input = el.querySelector('.sugestaoPlanoInput');
    const statusEl = el.querySelector('.sugestaoPlanoStatus');
    const texto = input.value.trim();
    if (!texto) return;
    statusEl.textContent = 'Enviando...';
    const { error } = await supa.from('sugestoes_planos').insert({
      owner_id: ownerId, texto, autor: sessaoAtual.nome || sessaoAtual.email

    if (error) {
      statusEl.textContent = `Erro: ${error.message}`;
    } else {
      statusEl.textContent = 'Enviado!';
      input.value = '';
      renderCoaching();
    }

}

async function carregarUmAUm(r, root, idPrefix) {
  const el = root.querySelector(`#${idPrefix}UmAUmHistorico`);
  if (!el) return;

  const { data, error } = await supa
    .from('um_a_um')
    .select('*')
    .eq('owner_id', r.ownerId)
    .order('data', { ascending: false });

  if (error) {
    el.innerHTML = `<div class="empty-state">Erro ao carregar: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    el.innerHTML = `<div class="empty-state">Nenhum 1:1 registrado ainda.</div>`;
  } else {
    el.innerHTML = data.map(reg => `
      <div class="daily-rep-card" style="margin-bottom:10px;">
        <div class="daily-rep-head" style="font-size:13px;">
          <span>${new Date(reg.data + 'T12:00:00').toLocaleDateString('pt-BR')}</span>
          <span style="color:var(--muted2);font-size:11px;">${reg.autor || ''}</span>
        </div>
        <div style="padding:12px 16px;">
          ${reg.resumo ? `<div style="font-size:13px;margin-bottom:8px;">${reg.resumo}</div>` : ''}
          ${(reg.compromissos && reg.compromissos.length > 0) ? `
            <ul class="practice-list" style="margin:0;">
              ${reg.compromissos.map(c => `<li>${c}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  const salvarBtn = root.querySelector(`#${idPrefix}UmAUmSalvar`);
  if (salvarBtn) {
    salvarBtn.addEventListener('click', async () => {
      const data = root.querySelector(`#${idPrefix}UmAUmData`).value || new Date().toISOString().slice(0, 10);
      const resumo = root.querySelector(`#${idPrefix}UmAUmResumo`).value.trim();
      const compromissosTexto = root.querySelector(`#${idPrefix}UmAUmCompromissos`).value.trim();
      const compromissos = compromissosTexto ? compromissosTexto.split('\n').map(s => s.trim()).filter(Boolean) : [];
      const statusEl = root.querySelector(`#${idPrefix}UmAUmStatus`);

      statusEl.textContent = 'Salvando...';
      const { error: erroSalvar } = await supa.from('um_a_um').insert({
        owner_id: r.ownerId,
        data,
        autor: sessaoAtual.nome || sessaoAtual.email,
        resumo,
        compromissos
      });

      if (erroSalvar) {
        statusEl.textContent = `Erro: ${erroSalvar.message}`;
      } else {
        statusEl.textContent = 'Salvo!';
        root.querySelector(`#${idPrefix}UmAUmResumo`).value = '';
        root.querySelector(`#${idPrefix}UmAUmCompromissos`).value = '';
        carregarUmAUm(r, root, idPrefix);
      }
    });
  }
}
