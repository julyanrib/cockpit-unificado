name: Atualizar cockpit diariamente

on:
  schedule:
    # ══════════════════════════════════════════════════════════════════════════════
    # A GRADE (02/09/26, pedido do Julyan: "pelo menos um intervalo de 2 em 2 horas no
    # horário comercial, passou das 19 horas, só voltaria as 08:30").
    #
    # O cron do GitHub é UTC. Brasília = UTC−3 (sem horário de verão desde 2019), então
    # a conversão é fixa: some 3 para chegar no UTC.
    #
    # O QUE ISTO É: o PISO. O webhook do HubSpot (api/hubspot-webhook.js) dispara este
    # mesmo workflow quando algo muda no pipeline, com janela de 60 min — medido nas 18
    # últimas rodadas: 15 vieram do webhook, de hora em hora. Esta grade garante o dia
    # sem atividade nenhuma, em que o webhook não tem o que disparar.
    # ══════════════════════════════════════════════════════════════════════════════
    #
    # 08:30 BRT — ABRE O DIA. fetch-hubspot grava "hoje" E "ontem", então esta rodada
    # também refecha o dia anterior (segurança, se a última da véspera falhou). Uma hora
    # inteira de margem antes das 9h30, que é quando a promessa da Daily trava.
    - cron: '30 11 * * 1-5'
    # o comercial, de 2 em 2 horas
    - cron: '30 13 * * 1-5'   # 10:30 BRT
    - cron: '30 15 * * 1-5'   # 12:30 BRT
    - cron: '30 17 * * 1-5'   # 14:30 BRT
    - cron: '30 19 * * 1-5'   # 16:30 BRT
    - cron: '30 21 * * 1-5'   # 18:30 BRT
    # 19:00 BRT — FECHA O PLACAR. A Daily congela às 19h; este é o número que o executivo
    # vê no fechamento do dia e o gestor lê na manhã seguinte. Depois desta, nada roda até
    # as 08:30 do próximo dia útil.
    - cron: '0 22 * * 1-5'
    # 09:00 BRT de sábado e domingo — UMA rodada. Não é horário comercial, e é de
    # propósito: sem ela o snapshot de sexta às 19h envelhece até segunda às 08:30, e quem
    # abrir o cockpit no domingo vê o funil de sexta como se fosse de agora. Custa dois
    # deploys e mantém o dado honesto.
    - cron: '0 12 * * 6,0'
  workflow_dispatch: # botão "Run workflow" no GitHub, e também o webhook do HubSpot
    inputs:
      origem:
        description: "quem disparou: deixe vazio para disparo humano, o webhook manda webhook"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# CORREÇÃO (16/08/26, Julyan — deploy "sumindo"): duas rodadas deste workflow rodando
# próximas uma da outra é exatamente o incidente de 14/08 documentado abaixo (rebase
# com conflito, resolvido a favor da versão "mais fresca" gerada por ESTA execução).
# Esse mesmo mecanismo tem um efeito colateral perigoso quando quem fez o push
# concorrente foi um upload MANUAL (correção de bug, por ex.): se o checkout desta
# execução aconteceu ANTES do commit manual, "nossa versão mais fresca" na verdade é
# a mais VELHA, e a correção manual acaba sendo silenciosamente descartada no rebase.
# concurrency com cancel-in-progress:false enfileira (nunca cancela) uma 2ª execução
# em vez de deixar as duas rodarem em paralelo e disputar o mesmo commit — não elimina
# 100% a janela de risco (o checkout ainda pode ficar desatualizado se um push manual
# acontecer bem no meio da execução), mas corta a maior parte dela. Ver também
# COOLDOWN_MINUTOS em api/hubspot-webhook.js (15→60min no mesmo ajuste) — menos
# disparos automáticos por hora = menos chance de qualquer sobreposição.
concurrency:
  group: cockpit-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Buscar dados frescos do HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # Também grava o snapshot do dia (realizado_visitas etc.) na tabela dailies —
          # sem essas duas variáveis o snapshot é pulado em silêncio e o histórico
          # da Daily volta a depender de alguém abrir a tela antes da meia-noite.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-hubspot.js

      # ==================================================================
      # CADÊNCIA DA IA (28/08/26) — o texto de IA sai UMA vez por dia útil.
      #
      # Antes os dois geradores rodavam nas TRÊS rodadas diárias, todos os dias.
      # A conta, com 7 executivos e uma chamada por executivo em cada gerador:
      #
      #   17 rodadas/semana x 14 chamadas = 238
      #   + 15 do weekly-summary de sexta
      #   = 253 chamadas de IA por semana
      #
      # Foi isso que esgotou o crédito da Anthropic em 27/08 (7 falhas seguidas
      # gravadas em _falhasIA), e o esgotamento derrubou a leitura semanal do time.
      #
      # O que se perdia pagando 3x por dia: NADA que o produto use. O gargalo do dia
      # alimenta a Daily das 9h — quem importa é a rodada de 08:56. E a análise
      # individual é um COMPROMISSO DE SEMANA: o próprio prompt dela manda "dentro da
      # mesma semana, mantenha os compromissos estáveis... compromisso que muda todo
      # dia vira ruído e o executivo para de levar a sério".
      #
      # Agora: 5 dias uteis x 14 + 15 = 85 chamadas/semana. Corte de 66%, sem perder
      # nenhuma leitura que alguém abre. As outras duas rodadas do dia continuam
      # atualizando NÚMERO (fetch-hubspot, ganhos, ranking) — só o texto de IA que
      # deixa de ser regerado.
      # ==================================================================
      - name: Esta rodada gera texto de IA?
        id: portao_ia
        run: |
          # Só a rodada da manhã e o disparo manual geram texto.
          #
          # ATENÇÃO — ESTE PORTÃO ESTÁ ACOPLADO À GRADE DE CRON LÁ EM CIMA, pela STRING do
          # agendamento. Ao trocar a grade em 02/09/26 (de 08:56/13:00/19:00 para 2 em 2
          # horas) esta comparação apontava para "56 11 * * *", um cron que deixou de
          # existir — e o efeito seria SILENCIOSO: nenhuma rodada agendada geraria mais o
          # gargalo do dia nem o compromisso da semana, e ninguém veria erro nenhum. Se a
          # grade mudar de novo, esta linha muda junto.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "gerar=sim" >> "$GITHUB_OUTPUT"
            echo "Disparo manual — vai gerar texto de IA."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" != "30 11 * * 1-5" ]; then
            echo "gerar=nao" >> "$GITHUB_OUTPUT"
            echo "Rodada de ${{ github.event.schedule }} — atualiza número, não regera texto de IA."
            exit 0
          fi
          # O COMPROMISSO É DA SEMANA, então nasce na SEGUNDA (28/08/26).
          #
          # O prompt da análise individual manda, com todas as letras: "dentro da
          # mesma semana, mantenha os compromissos atuais estáveis (repita-os)...
          # compromisso que muda todo dia vira ruído e o executivo para de levar a
          # sério". Gerar de novo terça, quarta e quinta é pagar cinco vezes por um
          # artefato que deve ser um só — e ainda dá cinco chances de ele mudar.
          #
          # Segunda de manhã ele nasce com a semana inteira pela frente. Sexta o
          # workflow weekly-summary fecha a semana e cuida do mensal, à parte.
          DIA=$(TZ=America/Sao_Paulo date +%u)   # 1=segunda ... 7=domingo
          if [ "$DIA" = "1" ]; then
            echo "gerar=sim" >> "$GITHUB_OUTPUT"
            echo "Segunda de manhã — compromisso da semana vai ser gerado."
          else
            echo "gerar=nao" >> "$GITHUB_OUTPUT"
            echo "Dia $DIA — compromisso da semana já existe, não regera."
          fi

      # ------------------------------------------------------------------
      # O ROBÔ DO GARGALO EM PROSA FOI APAGADO (05/09/26), a pedido do Julyan, na revisão
      # de custo de API. Ele já estava fora do cron desde 28/08 (só disparo manual), e o
      # efeito disso era pior que o custo: os três campos que ele escrevia — gargalo, tag
      # e tagLabel — ficaram CONGELADOS na tela do gestor, texto de 03/09 afirmando o
      # estado de hoje.
      # No lugar entraram duas funções no próprio template: estadoDoRep() e
      # fraseDoGargalo(), que saem de gargaloDoRep() + GESTO_DA_ETAPA — o funil de agora,
      # de graça, e dizendo o GESTO em vez de descrever o problema.
      # ------------------------------------------------------------------


      # ------------------------------------------------------------------
      # O COACHING DE SEGUNDA FOI FUNDIDO NO SEMANAL (05/09/26).
      # Eram dois robôs lendo o MESMO funil com 4 dias de distância: este, na segunda de
      # manhã (7 chamadas, escrevia os compromissos do 1:1 e a análise de coaching), e o
      # generate-weekly-summary de sexta (1 de time + 7 individuais, escrevia a leitura
      # da semana). Agora é uma rodada só, domingo 22h, e cada chamada individual devolve
      # os dois conjuntos de campos: 15 chamadas por semana viraram 8.
      # Consequência aqui: NENHUM passo deste workflow diário chama a IA. O portão
      # steps.portao_ia continua existindo porque é ele que decide se vale commitar
      # narrativas, mas nenhuma chamada de API depende mais dele.
      # ------------------------------------------------------------------

      - name: Atualizar números de ganhos/ranking/reuniões (sem gerar texto de IA)
        env:
          # AS CHAVES DO SUPABASE ENTRARAM AQUI EM 02/09/26, e faltavam. Este script passou
          # a publicar o weekly-raw na tabela (etapa 2 da virada), e o passo só recebia o
          # token do HubSpot — então a publicação era pulada pela própria guarda de ambiente
          # do script, EM SILÊNCIO. Medido: a rodada de 22:54 terminou com sucesso, o script
          # rodou, e a tabela não tinha a linha do weekly-raw. Descobri conferindo a tabela,
          # não pelo log — e é por isso que o script agora reclama alto quando roda no CI
          # sem as chaves.
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-weekly-comparison.js

      # REMOVIDO (16/08/26, pedido explícito do Julyan): "não quero essa busca também"
      # — scripts/fetch-clientes-ativos.js consultava o pipeline de Sucesso (87367429),
      # que não é o pipeline de Field Sales (916011864). Alimentava a sugestão de
      # "cliente ativo" na microrrota (visita de relacionamento/upsell). Primeiro só
      # desativado; e a intenção era remover o script e o dado de vez.
      #
      # ESTE COMENTÁRIO AFIRMOU POR 18 DIAS UMA REMOÇÃO QUE NÃO ACONTECEU (corrigido em
      # 03/09/26). Ele — e outro igual no template — dizia que scripts/fetch-clientes-
      # ativos.js e data/clientes-ativos.json "foram removidos de vez do repositório".
      # Os dois continuavam lá: 277 linhas de script e um arquivo com "[]" dentro, sem
      # nenhum consumidor (conferido: nenhum workflow o chama, nenhum módulo o importa,
      # nada lê o JSON em runtime). Foi a guarda 15 que os encontrou, ao procurar arquivo
      # gerado que fica versionado gerando deploy.
      # Agora os dois foram removidos de fato. Comentário que descreve uma limpeza que
      # não houve é pior que nenhum: quem lê para de procurar.
      # Se a régua mudar de novo, é reconstruir o script do zero, não reativar um passo
      # antigo.

      # Enche o cache de estabelecimentos OSM das praças fixas de cada executivo, pra que
      # de dia a Rota & Agenda responda em ~500ms em vez dos 62s medidos na 1ª consulta ao
      # vivo. Âncora com cache fresco (< 21 dias) é pulado sem gastar consulta, então esta
      # etapa é praticamente gratuita na rodada das 08:59 e serve de 2ª tentativa pra
      # qualquer praça que tenha falhado às 23:59.
      #
      # continue-on-error: a Overpass é um serviço público mantido por voluntários e cai
      # sozinha às vezes. Se cair, o executivo só volta a esperar alguns segundos na
      # primeira consulta — não é motivo pra deixar o cockpit inteiro sem atualizar.
      - name: Pré-aquecer cache de estabelecimentos OSM das praças de campo
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/prewarm-osm.js

      - name: Gerar HTML final
        run: node scripts/build.js

      - name: Commitar e enviar alterações (se houver)
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          # git rebase --continue abre um editor por padrão pra confirmar a mensagem do
          # commit — num runner sem terminal interativo isso trava o job (reproduzido
          # ao vivo no sandbox: sem isto, o job fica pendurado esperando o editor em vez
          # de terminar). "true" como editor aceita a mensagem como está e segue.
          export GIT_EDITOR=true
          # ADD POR DIRETÓRIO, não por lista à mão (02/09/26). A lista de seis arquivos
          # que estava aqui deixava de fora data/field-sales-playbook.compiled.json — ACHADO
          # em 02/09/26 forçando a disputa de push de propósito: o build recompila o playbook,
          # e UMA das páginas dele (o catálogo) é gerada a partir do dado do CRM, então o
          # arquivo muda em quase toda rodada. Ele ficava modificado e não preparado, e
          # grava — e árvore suja faz `git rebase` se recusar a rodar, que é como seis
          # árvore suja faz o rebase se recusar a rodar: foi assim que seis rodadas em dois
          # dias buscaram tudo do HubSpot e não publicaram nada (issues
          # #161 #170 #172 #181 #192 #200). data/ e public/ são exatamente os dois
          # diretórios que este job gera; qualquer arquivo novo entra sozinho.
          # ETAPA 2 DA VIRADA (02/09/26): o snapshot do CRM saiu do git — ele vai para a
          # tabela do Supabase, publicado pelo proprio fetch-hubspot. Os seis arquivos
          # estao no .gitignore, com o motivo escrito la.
          # O preparo continua sendo por DIRETORIO e nao por
          # lista a mao: o gitignore e que decide o que fica fora. Lista a mao aqui
          # envelheceu duas vezes hoje, das duas nas mesmas circunstancias.
          # O que sobra em data/ e configuracao editada a mao e o playbook compilado —
          # este e deterministico e nao le nada do CRM (conferido: dois builds seguidos
          # dao o mesmo md5), entao rodada sem mudanca de codigo nao gera commit nenhum,
          # e sem commit nao ha deploy.
          git add -A data public
          # e se sobrou algo sujo FORA desses dois diretórios, diz o que é. Silêncio aqui
          # foi o que fez o defeito durar dois dias.
          SUJO_FORA=$(git status --porcelain | grep -v -E "^[AMDR ]+ ?(data|public)/" || true)
          if [ -n "$SUJO_FORA" ]; then
            echo "ATENÇÃO — modificação fora de data/ e public/ nesta rodada:"
            echo "$SUJO_FORA"
          fi
          git diff --staged --quiet && echo "Nada mudou hoje." && exit 0

          git commit -m "Atualização automática do cockpit ($(date -u +'%H:%M UTC'))"

          # O checkout deste job foi feito no início do workflow — se alguém commitou
          # direto no main enquanto o robô rodava (ex.: colando um arquivo no editor do
          # GitHub, ou uma 2ª execução do workflow rodando em paralelo), o push simples
          # é rejeitado por não ser mais fast-forward. Busca o que mudou e reaplica o
          # commit do robô por cima antes de tentar de novo, em vez de deixar a
          # atualização do dia se perder.
          #
          # CORREÇÃO (14/08/26) — incidente real: duas execuções deste workflow
          # rodaram próximas uma da outra (agendada + disparo manual) e regeneraram
          # data/narrativas.json e data/weekly-raw.json com conteúdo diferente ao
          # mesmo tempo (a IA nunca escreve o mesmo texto duas vezes). O `git rebase`
          # tentou mesclar os dois JSONs linha a linha, não conseguiu (são strings de
          # IA divergentes na mesma chave, não uma edição humana pra revisar) e o job
          # morreu com "CONFLICT (content)" sem nada ser enviado.
          #
          # Esses arquivos são 100% derivados (fetch-hubspot.js/generate-weekly-summary.js
          # os regeram do zero nesta mesma execução) — não existe "mesclar" duas versões
          # geradas por IA em momentos diferentes, e a versão MAIS FRESCA (a que este
          # job acabou de gerar, com o HubSpot mais atual) é sempre a certa a manter.
          # Em caso de conflito de rebase, resolve automaticamente ficando com a nossa
          # versão recém-gerada desses arquivos específicos e segue o rebase — só
          # aborta e pede intervenção manual se o conflito for em outro lugar
          # (ex.: alguém editou um data/*.json à mão, o que não deveria acontecer).
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — buscando o main mais recente e tentando de novo..."
            git fetch origin main
            # --autostash: se sobrou qualquer modificação não preparada, o git guarda,
            # rebaseia e devolve. Sem isto o rebase ABORTA com "You have unstaged
            # changes" e o job morre com o snapshot do dia na mão — foi o defeito.
            if ! git rebase --autostash origin/main; then
              CONFLITOS=$(git diff --name-only --diff-filter=U)
              # SEM CONFLITO E COM REBASE FALHANDO é outra coisa (árvore em estado
              # inesperado, referência ruim). O handler antigo tratava tudo como
              # conflito, anunciava "conflito só nos arquivos gerados" com lista vazia e
              # chamava `git rebase --continue` sem rebase em andamento: exit 128 e
              # nenhuma pista. Agora diz o que é e para.
              if [ -z "$CONFLITOS" ]; then
                echo "Rebase falhou SEM conflito de conteúdo — estado do repositório:"
                git status --porcelain
                git rebase --abort || true
                exit 1
              fi
              # A LISTA DE AUTO-RESOLUÇÃO CONTINUA EXPLÍCITA, e de propósito: em data/ também
              # vivem arquivos editados À MÃO (usuarios.json, precificacao.json,
              # redes-excluidas.json, os playbooks .md). Conflito neles é edição humana e TEM
              # que parar para revisão — resolver "pela versão mais fresca" apagaria o que
              # alguém escreveu. Só entram aqui os 100% derivados, que o job regera do zero.
              # field-sales-playbook.compiled.json entrou em 02/09/26, pelo mesmo motivo e
              # pela segunda vez: build-playbook.js o regera do zero em cada rodada, porque
              # uma das paginas dele sai do dado do CRM. Faltando aqui, duas rodadas
              # simultaneas abortavam a segunda acusando conflito em arquivo que o proprio
              # job gerou.
              # resumo-semanal.json entrou em 02/09/26: é gerado por generate-weekly-summary
              # e faltava na lista.
              INESPERADOS=$(echo "$CONFLITOS" | grep -v -E '^data/(hubspot|hubspot-previous|weekly-raw|narrativas|sync-status|resumo-semanal|field-sales-playbook\.compiled)\.json$|^public/index\.html$' || true)
              if [ -n "$INESPERADOS" ]; then
                echo "Conflito em arquivo que não é gerado por este job — abortando pra revisão manual:"
                echo "$INESPERADOS"
                git rebase --abort
                exit 1
              fi
              echo "Conflito só nos arquivos gerados por este job — ficando com a versão recém-gerada (mais fresca) e continuando o rebase:"
              echo "$CONFLITOS"
              echo "$CONFLITOS" | xargs -r git checkout --theirs --
              echo "$CONFLITOS" | xargs -r git add
              git rebase --continue
            fi
          done

          echo "Não consegui enviar mesmo após 3 tentativas — verifique manualmente."
          exit 1

      # ══════════════════════════════════════════════════════════════════════════════
      # O ALARME É UM SÓ, E ELE FECHA SOZINHO (08/09/26)
      #
      # Este passo chamava issues.create() direto, sem procurar nada antes. Em 08/09/26
      # isso rendeu 75 issues IDÊNTICAS em um único dia: das 89 abertas no repositório,
      # todas eram alarme e nenhuma era assunto de verdade. Alarme que dispara 75 vezes
      # não é alarme — ele enterra o sinal. E enterrou: a falha real (a guarda 25 exigindo
      # um arquivo que o .gitignore não deixa o CI ter, corrigida no PR #452) ficou
      # invisível no meio do ruído, e as 75 foram fechadas à mão depois.
      #
      # AGORA: UM alarme aberto por vez. Já existindo um, esta rodada vira um COMENTÁRIO
      # nele com o link da rodada. A dedupe é pelo RÓTULO alarme-robo, não pelo texto do
      # título: o título tem a data dentro, então casar por título abriria um alarme novo
      # a cada dia que a falha durasse — o mesmo acúmulo, só que mais devagar. O rótulo
      # ainda deixa o filtro barato (uma listForRepo com labels, sem varrer o repositório)
      # e não depende de ninguém preservar o texto do título.
      # ══════════════════════════════════════════════════════════════════════════════
      - name: Avisar sobre falha (abre ou comenta o alarme)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const ROTULO = 'alarme-robo';
            const PREFIXO = '⚠️ Falha na atualização diária do cockpit';
            const hoje = new Date().toISOString().slice(0, 10);
            const link = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Procura o alarme aberto: primeiro pelo rótulo, que é o filtro barato; depois,
            // só se não achou nada, pelo começo do título — alarme aberto ANTES desta
            // mudança não tem rótulo nenhum e não pode virar órfão eterno por causa disso.
            async function alarmesAbertos() {
              try {
                const porRotulo = await github.rest.issues.listForRepo({
                  owner: owner, repo: repo, state: 'open', labels: ROTULO, per_page: 100
                });
                const achados = porRotulo.data.filter(function (i) { return !i.pull_request; });
                if (achados.length) return achados;

                const todas = await github.rest.issues.listForRepo({
                  owner: owner, repo: repo, state: 'open', per_page: 100
                });
                return todas.data.filter(function (i) {
                  return !i.pull_request && i.title.indexOf(PREFIXO) === 0;
                });
              } catch (erro) {
                // Não achar não pode virar silêncio: sem a lista, abrir a issue é o menos pior.
                core.warning('não consegui listar os alarmes abertos: ' + erro.message);
                return [];
              }
            }

            const abertos = await alarmesAbertos();

            if (abertos.length) {
              const alvo = abertos[0];
              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: alvo.number,
                body: 'Falhou de novo em ' + hoje + '.\n\nRodada: ' + link
              });
              core.notice('alarme #' + alvo.number + ' já estava aberto — comentei nele em vez de abrir outro');
              return;
            }

            // O rótulo é criado na primeira vez que o alarme dispara. Já existindo, a API
            // devolve 422 e seguir em frente é o certo.
            try {
              await github.rest.issues.createLabel({
                owner: owner,
                repo: repo,
                name: ROTULO,
                color: 'd93f0b',
                description: 'alarme automático do robô de atualização diária'
              });
            } catch (erro) {
              core.debug('rótulo ' + ROTULO + ' não foi criado agora: ' + erro.message);
            }

            const criada = await github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: PREFIXO + ' — ' + hoje,
              labels: [ROTULO],
              body: [
                'A atualização automática do cockpit falhou.',
                '',
                'Rodada: ' + link,
                '',
                'Causas comuns: token do HubSpot expirado/revogado, mudança de escopo na API, ou limite de requisições.',
                '',
                'Enquanto esta issue estiver ABERTA, as próximas falhas viram comentário aqui, e não issue nova. A primeira rodada verde fecha esta issue sozinha.'
              ].join('\n')
            });
            core.notice('abri o alarme #' + criada.data.number);

      # ══════════════════════════════════════════════════════════════════════════════
      # QUEM ABRE O ALARME TAMBÉM FECHA (08/09/26)
      #
      # Antes ninguém fechava. Alarme vencido ficava aberto até alguém varrer à mão, e em
      # 08/09/26 ainda havia alarme de JULHO aberto. Issue aberta que não corresponde a
      # nada quebrado é a mesma doença das 75: ruído com cara de sinal. A rodada verde é a
      # prova de que a falha passou — então é ela quem fecha, dizendo QUAL rodada voltou a
      # passar, para quem abrir a issue depois entender sem precisar caçar log.
      #
      # Fechar nunca pode derrubar a rodada: quando este passo roda, o dado do dia já está
      # publicado, e perder a publicação por causa da faxina de um aviso seria pior que o
      # alarme vencido. Por isso o corpo inteiro está dentro de um try.
      # ══════════════════════════════════════════════════════════════════════════════
      - name: Fechar alarme quando a rodada volta a passar
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const ROTULO = 'alarme-robo';
            const PREFIXO = '⚠️ Falha na atualização diária do cockpit';
            const link = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const porRotulo = await github.rest.issues.listForRepo({
                owner: owner, repo: repo, state: 'open', labels: ROTULO, per_page: 100
              });
              let abertos = porRotulo.data.filter(function (i) { return !i.pull_request; });

              if (!abertos.length) {
                const todas = await github.rest.issues.listForRepo({
                  owner: owner, repo: repo, state: 'open', per_page: 100
                });
                abertos = todas.data.filter(function (i) {
                  return !i.pull_request && i.title.indexOf(PREFIXO) === 0;
                });
              }

              if (!abertos.length) {
                core.info('nenhum alarme aberto para fechar');
                return;
              }

              for (const alarme of abertos) {
                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: alarme.number,
                  body: 'Voltou a passar. Rodada verde: ' + link + '\n\nFechando este alarme automaticamente.'
                });
                await github.rest.issues.update({
                  owner: owner,
                  repo: repo,
                  issue_number: alarme.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                core.notice('fechei o alarme #' + alarme.number);
              }
            } catch (erro) {
              core.warning('não consegui fechar o alarme: ' + erro.message);
            }
