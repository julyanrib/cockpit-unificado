name: Atualizar cockpit diariamente

on:
  schedule:
    # 05:00 em Brasília (08:00 UTC) todos os dias — refresh COMPLETO (inclui o
    # diagnóstico de gargalo por IA), de madrugada, pra já estar tudo fresco antes
    # da Daily das 9h.
    - cron: '0 8 * * *'
    # A cada 2h em horário comercial (08h, 10h, 12h, 14h, 16h, 18h, 20h em Brasília =
    # 11,13,15,17,19,21,23 UTC) — só números do HubSpot, SEM regenerar o texto de
    # gargalo por IA. Antes, "Realizado" só refletia o que o executivo fez no dia
    # ANTERIOR (só atualizava 1x, de madrugada) — uma visita feita às 14h só aparecia
    # no cockpit no dia seguinte. Agora o número sobe ao longo do próprio dia.
    # Rodar generate-daily-gargalo.js (que chama a API da Claude) nesses horários
    # também multiplicaria o custo de IA por 7x sem ganho real — o texto de gargalo
    # não precisa mudar de 2 em 2h, só os números precisam.
    - cron: '0 11,13,15,17,19,21,23 * * *'
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar dados frescos do HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-hubspot.js

      - name: Gerar diagnóstico de gargalo do dia (IA — só o texto, nunca mexe em compromissos de PDI)
        # SÓ roda no refresh completo da madrugada (ou manual) — os runs de horário
        # comercial (a cada 2h) existem só pra deixar os NÚMEROS quase em tempo real;
        # o texto de gargalo não precisa (nem deveria) ser regerado 7x por dia.
        if: ${{ github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-gargalo.js

      - name: Atualizar números de ganhos/ranking/reuniões (sem gerar texto de IA)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-weekly-comparison.js

      - name: Gerar HTML final
        run: node scripts/build.js

      - name: Commitar e enviar alterações (se houver)
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add data/hubspot.json data/hubspot-previous.json data/weekly-raw.json data/narrativas.json public/index.html
          git diff --staged --quiet && echo "Nada mudou hoje." && exit 0

          git commit -m "Atualização automática do cockpit ($(date -u +'%H:%M UTC'))"

          # O checkout deste job foi feito no início do workflow — se alguém commitou
          # direto no main enquanto o robô rodava (ex.: colando um arquivo no editor do
          # GitHub), o push simples é rejeitado por não ser mais fast-forward. Busca o
          # que mudou e reaplica o commit do robô por cima antes de tentar de novo, em
          # vez de deixar a atualização do dia se perder.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — buscando o main mais recente e tentando de novo..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Não consegui enviar mesmo após 3 tentativas — verifique manualmente."
          exit 1

      # Se qualquer passo acima falhar (token expirado, HubSpot mudou algo, etc.),
      # abre um Issue visível no repositório — assim dá pra perceber sem precisar
      # entrar no site todo dia pra conferir se a data bateu.
      - name: Avisar sobre falha (abre Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Falha na atualização diária do cockpit — ${new Date().toISOString().slice(0,10)}`,
              body: `A atualização automática do cockpit falhou.\n\nVeja o log completo aqui: ${context.payload.repository.html_url}/actions/runs/${context.runId}\n\nCausas comuns: token do HubSpot expirado/revogado, mudança de escopo na API, ou limite de requisições.`
            });
