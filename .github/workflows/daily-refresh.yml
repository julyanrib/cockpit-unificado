name: Atualizar cockpit diariamente

on:
  schedule:
    # 05:00 em Brasília (08:00 UTC), uma vez por dia — refresh COMPLETO (dados do
    # HubSpot, diagnóstico de gargalo por IA, coaching, clientes ativos). Já fica
    # tudo fresco antes da Daily das 9h, e o time entra sabendo do dia anterior.
    #
    # Correção 10/08 (pedido do Julyan): existiam mais duas execuções — uma às
    # 08:59 (1 min antes da Daily) e outra de 2 em 2h em horário comercial (08h,
    # 10h, 12h, 14h, 16h, 18h, 20h) só pra deixar "visitas/avanços realizados"
    # quase em tempo real ao longo do dia. Custava HubSpot + Vercel à toa pra um
    # ganho que ninguém usava — a Daily já entra sabendo do dia anterior, não
    # precisa do número mudando no meio do expediente. Ficou só a rodada única
    # das 5h.
    - cron: '0 8 * * *'
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Buscar dados frescos do HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # Também grava o snapshot do dia (realizado_visitas etc.) na tabela dailies —
          # sem essas duas variáveis o snapshot é pulado em silêncio e o histórico
          # da Daily volta a depender de alguém abrir a tela antes da meia-noite.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-hubspot.js

      - name: Gerar diagnóstico de gargalo do dia (IA — só o texto, nunca mexe em compromissos de PDI)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-gargalo.js

      - name: Atualizar análise de coaching por executivo (IA — todo dia, análise da semana corrente)
        # É idempotente: apaga e regrava a análise da semana corrente (owner+semana),
        # então rodar diariamente não duplica nada. O workflow de sexta continua
        # existindo à parte (fecha a semana às 16h e cuida do mensal).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-individual-analysis.js

      - name: Atualizar números de ganhos/ranking/reuniões (sem gerar texto de IA)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-weekly-comparison.js

      - name: Atualizar lista de clientes Takeat ativos (pra sugestão de microrrota)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-clientes-ativos.js

      - name: Gerar HTML final
        run: node scripts/build.js

      - name: Commitar e enviar alterações (se houver)
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add data/hubspot.json data/hubspot-previous.json data/weekly-raw.json data/narrativas.json data/clientes-ativos.json public/index.html
          git diff --staged --quiet && echo "Nada mudou hoje." && exit 0

          git commit -m "Atualização automática do cockpit ($(date -u +'%H:%M UTC'))"

          # O checkout deste job foi feito no início do workflow — se alguém commitou
          # direto no main enquanto o robô rodava (ex.: colando um arquivo no editor do
          # GitHub), o push simples é rejeitado por não ser mais fast-forward. Busca o
          # que mudou e reaplica o commit do robô por cima antes de tentar de novo, em
          # vez de deixar a atualização do dia se perder.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — buscando o main mais recente e tentando de novo..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Não consegui enviar mesmo após 3 tentativas — verifique manualmente."
          exit 1

      # Se qualquer passo acima falhar (token expirado, HubSpot mudou algo, etc.),
      # abre um Issue visível no repositório — assim dá pra perceber sem precisar
      # entrar no site todo dia pra conferir se a data bateu.
      - name: Avisar sobre falha (abre Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Falha na atualização diária do cockpit — ${new Date().toISOString().slice(0,10)}`,
              body: `A atualização automática do cockpit falhou.\n\nVeja o log completo aqui: ${context.payload.repository.html_url}/actions/runs/${context.runId}\n\nCausas comuns: token do HubSpot expirado/revogado, mudança de escopo na API, ou limite de requisições.`
            });
