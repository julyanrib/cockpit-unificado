name: Recuperar semana da Daily (rodar 1x)

# Só dispara manualmente — não tem agendamento (schedule). Depois de rodar uma vez com
# sucesso, pode apagar este arquivo (ou deixar aí, sem problema — ele nunca roda sozinho).
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recalcular os últimos 7 dias direto do HubSpot e gravar no Supabase
        run: node scripts/backfill-dailies-semana.js
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
