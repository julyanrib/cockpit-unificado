name: Resumo semanal (sexta-feira)

on:
  schedule:
    # 16h em Brasília (19h UTC), toda sexta-feira — assim o plano já está pronto
    # antes da daily de segunda, não gerado em cima da hora
    - cron: '0 19 * * 5'
  workflow_dispatch:
    inputs:
      force_monthly_mesano:
        description: 'Força o FECHAMENTO MENSAL (pro time/executivo em generate-weekly-summary.js, e pro coaching em generate-individual-analysis.js) pra um mês específico (AAAA-MM, ex: 2026-07), sem esperar a última sexta-feira real. Deixe em branco pra rodar normal.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar comparação semana atual x anterior
        # Continua pulando esse fetch num teste forçado de mensal: o objetivo do teste é
        # validar a LÓGICA do fechamento mensal com os dados que já estão no repo, sem
        # gastar uma chamada real ao HubSpot fora do horário certo. Em produção (cron real
        # de sexta), isso sempre roda antes, force_monthly_mesano nunca vem setado.
        if: ${{ !inputs.force_monthly_mesano }}
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node scripts/fetch-weekly-comparison.js

      - name: Gerar resumo e plano de ação (API da Claude)
        # SEM 'if' aqui: agora este script decide sozinho, internamente, se gera o resumo
        # semanal normal ou o fechamento mensal (olhando FORCE_MONTHLY_MESANO ou a última
        # sexta do mês) — precisa rodar nos dois casos, senão o fechamento mensal do
        # item B nunca é gerado nem em teste nem de verdade.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_MONTHLY_MESANO: ${{ inputs.force_monthly_mesano }}
        run: node scripts/generate-weekly-summary.js

      - name: Gerar análise individual de coaching (só o gestor vê)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_MONTHLY_MESANO: ${{ inputs.force_monthly_mesano }}
        run: node scripts/generate-individual-analysis.js

      - name: Gerar HTML final
        # SEM 'if': o fechamento mensal escreve em data/resumo-semanal.json igual ao
        # semanal (mesmo formato) — precisa ser embutido no HTML publicado nos dois casos,
        # senão o teste forçado roda mas ninguém vê o resultado no site.
        run: node scripts/build.js

      - name: Commitar e enviar alterações
        # SEM 'if': idem acima — sem isso, um teste com force_monthly_mesano geraria o
        # fechamento mensal só dentro do runner e nunca chegaria no repo nem no site.
        run: |
          git config user.name "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add data/weekly-raw.json data/resumo-semanal.json data/narrativas.json public/index.html

          # historico-mensal-time.json só passa a existir depois do PRIMEIRO fechamento
          # mensal (e historico-semanal-mes.json podia, em teoria, não existir ainda numa
          # instalação nova) — 'git add' num caminho que não existe falha o comando inteiro
          # (foi o que quebrou a run #14: "pathspec did not match any files"). Adiciona só
          # se o arquivo já existir no working tree desta rodada.
          for f in data/historico-semanal-mes.json data/historico-mensal-time.json; do
            [ -f "$f" ] && git add "$f"
          done

          git diff --staged --quiet && echo "Nada mudou." && exit 0

          git commit -m "Resumo semanal automático"

          # O checkout deste job foi feito no início do workflow — se alguém commitou
          # direto no main enquanto o robô rodava (ex.: colando um arquivo no editor do
          # GitHub), o push simples é rejeitado por não ser mais fast-forward. Busca o
          # que mudou e reaplica o commit do robô por cima antes de tentar de novo, em
          # vez de deixar o resultado da geração se perder.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa) — buscando o main mais recente e tentando de novo..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Não consegui enviar mesmo após 3 tentativas — verifique manualmente."
          exit 1
