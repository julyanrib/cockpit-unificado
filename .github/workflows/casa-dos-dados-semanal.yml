name: Backfill semanal da Casa dos Dados

# Pedido explícito do Julyan (16/08/26): "a gente tem a api da casa dos dados, vamos
# automatizar isso e colocar lá, de todos". Auditoria real mostrou só 1 conta com essa
# fonte em toda a base (criada manualmente) e o Wericles (São Paulo) sem NENHUM lead de
# fonte nenhuma. Este workflow busca o backlog de contas-alvo por cidade toda semana e
# entrega pro mesmo endpoint que já cuida de roteamento por território, deduplicação e
# filtro de qualidade (api/importar-leads.js) — nenhuma lógica de negócio nova aqui.

on:
  schedule:
    # Domingo às 22h em Brasília (01:00 UTC de segunda) — a fila de Prospecção já
    # chega renovada quando o executivo abre a tela na segunda de manhã.
    - cron: '0 1 * * 1'
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"
    inputs:
      pular:
        description: "Cidades a PULAR nesta rodada, separadas por vírgula (ex.: Vitória). Em branco = todas."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Buscar contas-alvo na Casa dos Dados e importar
        env:
          CASADOSDADOS_TOKEN: ${{ secrets.CASADOSDADOS_TOKEN }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          # O COCKPIT MORA NO APP OUTBOUND desde 25/09/26: os leads entram pela
          # porta dos robos do APP (Edge Function cockpit-robo), que roda o mesmo
          # api/importar-leads.js deste repositorio. Sem esta linha o script cai no
          # padrao fieldsalestakeat.vercel.app e grava no banco antigo, que ninguem le.
          COCKPIT_URL: https://mxyjvijclhlxrlafqcrz.supabase.co/functions/v1/cockpit-robo
          # em branco no cron semanal (todas as cidades); preenchido só quando alguém
          # dispara à mão pedindo para pular uma praça — a escolha fica no log da execução.
          PULAR_CIDADES: ${{ github.event.inputs.pular }}
        run: node scripts/backfill-casa-dos-dados.js

      - name: Publicar JSON pra importação manual (se o IMPORT_SECRET ainda não estiver ativo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-casa-dos-dados
          path: artifacts/leads-casa-dos-dados.json
          if-no-files-found: ignore
          retention-days: 7
